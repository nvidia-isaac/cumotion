# Test file for rotation validation - inline format
scene_file: content/nvidia/tests/scenario/scenes/valid_basic_scene.yaml

task_lists:
  - name: rotation_test_inline
    world_to_robot_base_transform:
      translation: [0.0, 0.0, 0.0]
      rotation: {w: 1.0, xyz: [0.0, 0.0, 0.0]}
    scene_name: basic_scene
    tool_frame: end_effector
    tasks:
      - name: task_rotation_inline
        initial_cspace_position:
          panda_joint1: 0.0
          panda_joint2: -1.57
          panda_joint3: 0.0
          panda_joint4: -1.57
          panda_joint5: 0.0
          panda_joint6: 2.0
          panda_joint7: 0.0
        task_space_target:
          translation_constraint:
            type: target
            translation_target: [0.5, 0.3, 0.2]
          orientation_constraint:
            type: terminal_target
            orientation_target: {w: 0.707, xyz: [0.0, 0.0, 0.707]}
            terminal_deviation_limit: 0.05
          task_space_target_in_robot_base_frame: true
